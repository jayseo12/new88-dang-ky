<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW88 - Premium Entertainment</title>
    <meta name="description" content="Trải nghiệm giải trí đỉnh cao cùng NEW88.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        // These will be overridden by CSS variables for dynamic theming
                        brand: {
                            DEFAULT: 'var(--primary)',
                            secondary: 'var(--secondary)',
                            accent: 'var(--accent)',
                        },
                        dark: {
                            bg: 'var(--bg)',
                            surface: 'var(--surface)',
                            border: 'var(--border)',
                        },
                        text: {
                            main: 'var(--text)',
                            muted: 'var(--muted)',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Template Theme Variables - Easily changed for new brands */
            --primary: #D4AF37; /* Gold */
            --secondary: #9C7C14; /* Darker Gold */
            --accent: #E5C158; /* Lighter Gold */
            
            --bg: #0A0A0A; /* Very Dark Gray/Black */
            --surface: #141414; /* Slightly lighter for cards */
            --surface-hover: #1A1A1A;
            
            --text: #F3F4F6; /* Off-white */
            --text-muted: #9CA3AF; /* Gray */
            
            --border: rgba(212, 175, 55, 0.2); /* Gold subtle border */
            --border-hover: rgba(212, 175, 55, 0.5);
            
            --glow: rgba(212, 175, 55, 0.15);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }

        /* Utility Classes */
        .glass-panel {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }
        
        .text-gradient {
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .border-gradient {
            position: relative;
            background: var(--surface);
            background-clip: padding-box;
            border: 1px solid transparent;
            border-radius: 0.5rem;
        }
        
        .border-gradient::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(to bottom right, var(--border-hover), transparent, var(--border-hover));
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        
        .border-gradient:hover::before {
            opacity: 1;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg);
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--glow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid var(--primary);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* Scroll Reveal Classes */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        
        .reveal-left.active {
            opacity: 1;
            transform: translateX(0);
        }
        
        .reveal-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        
        .reveal-right.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Header specific */
        header {
            transition: all 0.3s ease;
        }
        header.scrolled {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        
        .nav-link {
            position: relative;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: var(--primary);
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        /* Input styling */
        .form-input {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            transition: all 0.3s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
            background: rgba(20, 20, 20, 0.8);
        }
        
        /* Decorative Background Shapes */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

        /**
         * ==========================================
         * RENDER FUNCTIONS (Vanilla JS)
         * ==========================================
         */
        class PageBuilder {
            constructor(config) {
                this.config = config;
            }

            init() {
                this.applyTheme();
                this.buildHeader();
                this.buildHero();
                this.buildStats();
                this.buildCategories();
                this.buildFeatures();
                this.buildReviews();
                this.buildContact();
                this.buildFooter();
                
                // Initialize icons after all DOM elements are created
                lucide.createIcons();
            }

            applyTheme() {
                const root = document.documentElement;
                for (const [key, value] of Object.entries(this.config.colors)) {
                    root.style.setProperty(`--${key}`, value);
                }
            }

            buildHeader() {
                // Logo
                const logoHtml = this.config.logoUrl 
                    ? `<img src="${this.config.logoUrl}" alt="${this.config.brandName}" class="h-10">`
                    : this.config.logoText;
                
                document.getElementById('brand-logo').innerHTML = logoHtml;
                document.getElementById('footer-logo').innerHTML = logoHtml;

                // Menu
                const desktopMenu = document.getElementById('desktop-menu');
                const mobileMenuContainer = document.getElementById('mobile-menu-container');
                
                this.config.menu.forEach(item => {
                    // Desktop
                    const dLink = document.createElement('a');
                    dLink.href = item.url;
                    dLink.className = 'nav-link font-medium text-sm tracking-wide uppercase';
                    dLink.textContent = item.title;
                    desktopMenu.appendChild(dLink);

                    // Mobile
                    const mLink = document.createElement('a');
                    mLink.href = item.url;
                    mLink.className = 'mobile-nav-link text-white font-serif hover:text-brand transition-colors';
                    mLink.textContent = item.title;
                    mobileMenuContainer.appendChild(mLink);
                });

                // CTA Links
                document.getElementById('header-cta').href = this.config.links.register;
                document.getElementById('mobile-cta').href = this.config.links.register;
            }

            buildHero() {
                const { hero } = this.config;
                document.getElementById('hero-tagline').textContent = hero.tagline;
                
                // Handle highlight text
                const titleHtml = hero.title.replace('{highlight}', `<span class="text-gradient italic">${hero.highlightText}</span>`);
                document.getElementById('hero-title').innerHTML = titleHtml;
                
                document.getElementById('hero-desc').textContent = hero.description;
                
                const btnPrimary = document.getElementById('hero-btn-primary');
                btnPrimary.textContent = hero.primaryButton;
                btnPrimary.href = this.config.links.register;

                const btnSecondary = document.getElementById('hero-btn-secondary');
                btnSecondary.textContent = hero.secondaryButton;
                btnSecondary.href = this.config.links.download;

                document.getElementById('hero-image').src = hero.imageUrl;
                document.getElementById('badge-top').textContent = hero.badgeTop;
                document.getElementById('badge-bottom').textContent = hero.badgeBottom;
            }

                const container = document.getElementById('stats-container');

                        <div class="text-[10px] md:text-xs text-text-muted uppercase tracking-widest">${stat.label}</div>

                    container.appendChild(div);

                const selectElement = document.querySelector('#contact-form select');

            buildFooter() {
                document.getElementById('copyright').textContent = this.config.footer.copyright;

                    const a = document.createElement('a');

                    a.innerHTML = `<i data-lucide="${social.icon}" class="w-4 h-4"></i>`;
                    socialContainer.appendChild(a);
                });
            }
        }

        /**
         * ==========================================
         * INTERACTIONS & ANIMATIONS
         * ==========================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Initialize Page Builder
            const builder = new PageBuilder(SITE_CONFIG);
            builder.init();

            // 2. Mobile Menu Toggle
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');
            const mobileLinks = document.querySelectorAll('.mobile-nav-link');
            let isMenuOpen = false;

            function toggleMenu() {
                isMenuOpen = !isMenuOpen;
                if(isMenuOpen) {
                    mobileMenu.classList.remove('translate-x-full');
                    menuIcon.setAttribute('data-lucide', 'x');
                    document.body.style.overflow = 'hidden'; // Prevent scrolling
                } else {
                    mobileMenu.classList.add('translate-x-full');
                    menuIcon.setAttribute('data-lucide', 'menu');
                    document.body.style.overflow = '';
                }
                lucide.createIcons();
            }

            mobileBtn.addEventListener('click', toggleMenu);
            mobileLinks.forEach(link => {
                link.addEventListener('click', toggleMenu);
            });

            // 3. Header Scroll Effect
            const header = document.getElementById('header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // 4. Scroll Reveal Animation using Intersection Observer
            const revealElements = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
            
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target); // Run once
                    }
                });
            }, {
                root: null,
                threshold: 0.15,
                rootMargin: "0px 0px -50px 0px"
            });

            revealElements.forEach(el => revealObserver.observe(el));

            // 5. Back to Top Button
            const backToTopBtn = document.getElementById('back-to-top');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 500) {
                    backToTopBtn.classList.remove('opacity-0', 'invisible');
                    backToTopBtn.classList.add('opacity-100', 'visible');
                } else {
                    backToTopBtn.classList.add('opacity-0', 'invisible');
                    backToTopBtn.classList.remove('opacity-100', 'visible');
                }
            });

            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });

            // 6. Form Submission Prevention (for template)
            document.querySelector('form').addEventListener('submit', (e) => {
                e.preventDefault();
                // Add your form handling logic here
                alert('Form submitted! (This is a template preview)');
            });
            
            const formBtn = document.querySelector('form button');
            if(formBtn){
                formBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const btn = e.target;
                    const originalText = btn.textContent;
                    btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>';
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        btn.textContent = 'Gửi thành công!';
                        btn.classList.add('bg-green-600');
                        btn.classList.remove('bg-gradient-to-r');
                        
                        setTimeout(() => {
                            btn.textContent = originalText;
                            btn.classList.remove('bg-green-600');
                            btn.classList.add('bg-gradient-to-r');
                            document.getElementById('contact-form').reset();
                        }, 3000);
                    }, 1500);
                });
            }
        });
